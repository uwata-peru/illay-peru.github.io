<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uwata Perú · Viaja al corazón de la Amazonía</title>
<meta name="description" content="Pueblos del río, leyendas de los abuelos y un árbol que sembrarás tú. Turismo comunitario en Loreto, Perú.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="Uwata Perú">
<meta property="og:description" content="Viaja al corazón de la Amazonía: pueblos del río, leyendas y un árbol que sembrarás tú.">
<meta property="og:image" content="img/logo-uwata.png">
<link rel="icon" type="image/png" href="img/favicon-64.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-view="home">
<header class="top">
  <button class="logo" data-tab="home" aria-label="Uwata Perú, inicio">
    <img class="logo-pin" src="img/pin-160.png" alt="" width="34" height="40">
    <img class="logo-word" src="img/wordmark.png" alt="uwata" width="71" height="26">
  </button>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  <div class="top-r">
    <div class="langs" role="group" aria-label="Idioma / Language">
      <button data-lang="es">ES</button><button data-lang="en">EN</button><button data-lang="fr">FR</button>
    </div>
    <button class="login" data-tab="tree" id="loginBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 5-3 8-8 7z"/><path d="M12 14c0-3-2-5-7-5 0 4 3 6 7 5z"/></svg>
      <span id="loginTx">Ingresar</span>
    </button>
  </div>
</header>

<main id="panel" tabindex="-1"></main>

<!-- Mapa completo (se abre con "Ver mapa completo") -->
<div class="fullmap" id="fullmap" hidden>
  <div id="mapFull" aria-label="Mapa"></div>
  <div class="fm-bar">
    <button class="fm-back" data-act="closemap">← <span id="fmBack">Volver</span></button>
    <div class="layers" role="group" aria-label="Capas">
      <button data-layer="map" aria-pressed="true" id="lyMap">Clara</button>
      <button data-layer="sat" aria-pressed="false" id="lySat">Satélite</button>
    </div>
  </div>
  <div class="peek" id="peek" hidden></div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script src="vendor/qrcode/qrcode.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/hero.js"></script>
<script src="js/app.js"></script>
</body>
</html>
